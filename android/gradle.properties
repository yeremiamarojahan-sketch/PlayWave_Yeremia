org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Compatibility with flutter_inappwebview_android 1.1.3 on AGP 9.x.
# Remove when the plugin switches to proguard-android-optimize.txt.
android.r8.proguardAndroidTxt.disallowed=false

# Work around TLS handshake failures on the current network with Java 25.
# Keep HTTPS certificate verification enabled; use TLS 1.2 for downloads.
systemProp.https.protocols=TLSv1.2
systemProp.jdk.tls.client.protocols=TLSv1.2
